  <style>
    /* Hallmark · shape: app screen · genre: playful · theme: Arcade (deal 1/3, seed html-d592·e0b1b74f·2026-11-06·r0)

    /* Hallmark · finish-review: subagent · r1 recapture (offline fallback face, reduced-motion flash bug fixed) · r2 fix · 4 findings · 4 resolved (69 echo, 75 phone type, F20 lone row, offline head) */
    :root {
      color-scheme: dark;
      --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
      --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.7, 0, 0.84, 0); --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
      --color-error: oklch(72% 0.15 27); --color-success: oklch(76% 0.13 150);
      --container: 1120px; --gutter: 64px;
      --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300; --z-modal: 400; --z-toast: 500; --z-tooltip: 600;
      --color-paper: oklch(14% 0.04 312); --color-paper-2: oklch(18.5% 0.042 312); --color-paper-3: oklch(23% 0.045 312);
      --color-ink: oklch(95% 0.014 315); --color-ink-2: oklch(87% 0.018 315); --color-muted: oklch(71% 0.024 315);
      --color-rule: oklch(34% 0.05 312);
      --color-accent: oklch(66% 0.215 40); --color-accent-2: oklch(88% 0.195 115); --color-accent-ink: oklch(14% 0.04 312);
      --color-focus: oklch(88% 0.195 115);
      --color-crt-r: oklch(63% 0.24 25); --color-crt-g: oklch(80% 0.25 140); --color-crt-b: oklch(60% 0.24 265); --color-crt-c: oklch(78% 0.14 200); --color-shade: oklch(8% 0.02 315);
      /* accent-ink doubles as the dark ink on light surfaces (card fronts) */
      --color-card-muted: oklch(45% 0.03 312);
      --scanline: oklch(from var(--color-ink) l c h / 0.06);

      --font-body: "Chivo", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", ui-sans-serif, sans-serif;

    *, *::before, *::after { box-sizing: border-box; }

    .container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }

    .wordmark {
      font-family: var(--font-display); font-size: var(--text-md); line-height: 1;
      color: var(--color-ink);

    .wordmark .zh {
      margin-left: var(--space-2xs);
      font-family: var(--font-body); font-weight: 900; font-size: var(--text-sm);
      color: var(--color-muted); text-shadow: none;
    }
    .mode { font-size: var(--text-sm); font-weight: 700; color: var(--color-muted); }

    main { padding-block: var(--space-xl) var(--space-2xl); }
    h1 {
      margin: 0 0 var(--space-2xs);
      font-family: var(--font-body); font-weight: 900; font-size: var(--text-3xl); line-height: 1.12;

    }
    .lead { margin: 0 0 var(--space-lg); max-width: 52ch; color: var(--color-ink-2); }

    /* states: loading, empty, error */
    .state {
      display: flex; flex-direction: column; align-items: center; gap: var(--space-md);
      padding: var(--space-2xl) var(--space-lg); text-align: center;
    }
    .state p { max-width: 46ch; color: var(--color-ink-2); }
    .state-blink { width: 10px; height: 20px; background: var(--color-accent); animation: blink 1s steps(1) infinite; }

    /* menus: deck choice */
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg); }
    .choice {
      min-height: 128px; padding: var(--space-lg);
      background: var(--color-paper-2); color: var(--color-ink);
      border: var(--rule-bar) solid var(--color-rule); border-radius: var(--radius-card);
      box-shadow: 4px 4px 0 var(--color-accent-2);
      text-align: left; cursor: pointer;
      transition: translate var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }
    .choice:hover { background: var(--color-paper-3); translate: -1px -1px; box-shadow: 5px 5px 0 var(--color-accent-2); }
    .choice:active { translate: 2px 2px; box-shadow: 1px 1px 0 var(--color-accent-2); }
    .choice strong { display: block; font-weight: 900; font-size: var(--text-xl); line-height: 1.2; overflow-wrap: break-word; min-width: 0; }
    .choice span { display: block; margin-top: var(--space-2xs); color: var(--color-muted); font-size: var(--text-sm); }

    /* menus: category rows as a score list */
    .cats {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      border-block: var(--rule-hair) solid var(--color-rule);
    }
    .cat-row {
      display: flex; align-items: center; gap: var(--space-sm);
      min-height: 44px; padding: var(--space-2xs) var(--space-sm);
      background: none; border: 0; border-top: var(--rule-hair) solid var(--color-rule);
      color: var(--color-ink); text-align: left; cursor: pointer;
      transition: background-color var(--dur-micro) steps(1), color var(--dur-micro) steps(1);
    }
    .cats .cat-row:nth-child(-n+2) { border-top: 0; }
    .cats .cat-row:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .cat-row:hover:not(:disabled), .cat-row:focus-visible { background: var(--color-accent); color: var(--color-accent-ink); }
    .cat-row:disabled { opacity: 0.55; cursor: not-allowed; }
    .cat-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: break-word; }
    .cat-count { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cat-state { color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; }
    .cat-row:hover:not(:disabled) .cat-state, .cat-row:focus-visible .cat-state { color: var(--color-accent-ink); }

    /* controls */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2xs);
      min-height: 40px; padding: 0 var(--space-lg);
      background: var(--color-accent); color: var(--color-accent-ink);
      border: var(--rule-bar) solid var(--color-ink); border-radius: var(--radius-card);
      font-weight: 700; white-space: nowrap; cursor: pointer;
      box-shadow: 4px 4px 0 var(--color-accent-2);
      transition: translate var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
    }
    .btn:hover { translate: -1px -1px; box-shadow: 5px 5px 0 var(--color-accent-2); }
    .btn:active { translate: 2px 2px; box-shadow: 1px 1px 0 var(--color-accent-2); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; translate: none; box-shadow: 4px 4px 0 var(--color-accent-2); }
    .btn--quiet { background: transparent; color: var(--color-ink); border-color: var(--color-rule); box-shadow: none; }
    .btn--quiet:hover { background: var(--color-paper-2); translate: none; box-shadow: none; }
    .btn--quiet:active { translate: 1px 1px; }
    .foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); margin-top: var(--space-md); min-height: 44px; }
    .hint { color: var(--color-muted); font-size: var(--text-sm); }
    .note {
      margin-top: var(--space-xl); padding-top: var(--space-md);
      border-top: var(--rule-hair) solid var(--color-rule);
      color: var(--color-muted); font-size: var(--text-sm);
    }

    /* the CRT well: the screen the pack opens on */
    .well {
      position: relative; min-height: 720px;
      background: var(--color-paper-2);
      border: var(--rule-bar) solid var(--color-rule); border-radius: var(--radius-card);
      overflow: hidden;
    }
    .well.crt::after {
      content: ""; position: absolute; inset: 0; z-index: var(--z-raised); pointer-events: none;
      background-image:
        repeating-linear-gradient(to right, color-mix(in oklab, var(--color-crt-r) 5%, transparent) 0 1px, color-mix(in oklab, var(--color-crt-g) 5%, transparent) 1px 2px, color-mix(in oklab, var(--color-crt-b) 5%, transparent) 2px 3px),
        repeating-linear-gradient(to bottom, transparent 0 2px, color-mix(in oklab, var(--color-shade) 16%, transparent) 2px 3px);
    }

    .pack {
      position: absolute; left: 50%; top: 50%;
      display: flex; flex-direction: column; align-items: center;
      width: 210px; height: 300px; padding: 0;
      background: var(--color-paper-3); color: var(--color-ink);
      border: var(--rule-bar) solid var(--color-ink); border-radius: var(--radius-card);
      box-shadow: 6px 6px 0 var(--color-accent-2);
      transform: translate(-50%, -50%);
      cursor: pointer;
      animation: idle 2.4s var(--ease-in-out) infinite;
    }
    .pack-ribbon {
      align-self: stretch; padding: var(--space-2xs) 0;
      background: var(--color-accent); color: var(--color-accent-ink);
      font-family: var(--font-display); font-size: var(--text-md); letter-spacing: 0.02em; line-height: 1;
    }
    .pack.is-video .pack-ribbon { background: var(--color-accent-2); }
    .pack-num {
      display: block; margin-top: 84px;
      font-family: var(--font-outlier); font-weight: 700; font-size: 64px; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .pack-unit { display: block; margin-top: var(--space-2xs); font-weight: 700; color: var(--color-muted); }
    .pack-name { display: block; padding: 0 var(--space-md) var(--space-lg); font-weight: 700; overflow-wrap: break-word; min-width: 0; }
    .pack.is-shaking { animation: shake 0.5s var(--ease-in-out); }
    .pack.is-gone { animation: burst 0.4s var(--ease-out) forwards; pointer-events: none; }

    .burst {
      position: absolute; left: 50%; top: 50%;
      width: 36px; height: 36px;
      border: 6px solid var(--color-accent-2); border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .burst.is-on { animation: ring 0.65s var(--ease-out) forwards; }
    .flash {
      position: fixed; inset: 0; z-index: var(--z-modal);
      background: var(--color-ink);
      pointer-events: none;
    }
    .flash.is-on { animation: flash 0.45s var(--ease-out) forwards; }

    /* the fan: five cards on the star points */
    .fan { position: absolute; inset: 0; --orbit: 220px; }
    .card {
      --x: 0; --y: 0; --tilt: 0deg;
      position: absolute; left: 50%; top: 50%;
      width: 150px; height: 236px;
      perspective: 900px;
      transform: translate(calc(-50% + var(--x) * var(--orbit)), calc(-50% + var(--y) * var(--orbit))) rotate(var(--tilt));
      animation: deal 0.72s cubic-bezier(0.16, 0.84, 0.32, 1) both;
      animation-delay: calc(var(--i) * 80ms);
      cursor: pointer;
    }
    .inner {
      display: block; position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s var(--ease-in-out);
    }
    .card:hover { z-index: 4; }
    .card.is-open, .card.is-open:hover { z-index: 8; }
    .card:hover .side { box-shadow: 4px 4px 0 var(--color-accent-2); }
    .card.is-open .inner { transform: rotateY(180deg); }
    .side {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2xs);
      padding: var(--space-md);
      border: var(--rule-bar) solid var(--color-rule); border-radius: var(--radius-card);
      backface-visibility: hidden; overflow: hidden;
    }
    .back { background: var(--color-paper-3); color: var(--color-ink); }
    .deck-lunch .back b { color: var(--color-accent); }
    .deck-video .back b { color: var(--color-accent-2); }
    .back .k { color: var(--color-muted); font-size: var(--text-xs); }
    .back b { font-family: var(--font-outlier); font-weight: 700; font-size: 56px; line-height: 1; }
    .front {
      background: var(--color-ink); color: var(--color-accent-ink);
      transform: rotateY(180deg);
      align-items: stretch; justify-content: flex-start; gap: 0; padding: 0;
    }
    .rarity-legendary.is-open .front { outline: 3px solid var(--color-accent); outline-offset: -3px; }
    .rarity-rare.is-open .front { outline: 3px solid var(--color-accent-2); outline-offset: -3px; }
    .rarity-legendary.is-open .front::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, transparent 30%, color-mix(in oklab, var(--color-accent) 30%, transparent) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: shine 0.8s var(--ease-out);
    }
    .face {
      display: flex; flex-direction: column; align-items: stretch; gap: var(--space-3xs);
      width: 100%; height: 100%; min-height: 0;
      padding: var(--space-sm) var(--space-sm) var(--space-md);
      overflow: hidden; text-align: left; overflow-wrap: break-word;
    }
    .kicker, .front h2, .line, .reason, .link { flex-shrink: 0; }
    .kicker { color: var(--color-card-muted); font-size: var(--text-xs); line-height: 1.2; }
    .front h2 {
      margin: 0; font-family: var(--font-body); font-weight: 900; letter-spacing: 0;
      font-size: var(--text-md); line-height: 1.25;
      max-height: calc(1.25em * 2);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .line, .reason { margin: 0; font-size: var(--text-xs); line-height: 1.35; color: var(--color-card-muted); }
    .reason {
      max-height: calc(1.35em * 2);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .link {
      color: var(--color-accent-ink); font-size: var(--text-xs); line-height: 1.3;
      text-decoration: underline; text-decoration-color: var(--color-accent-2); text-decoration-thickness: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @keyframes idle {
      0%, 100% { transform: translate(-50%, -50%) rotate(-1deg); }
      50% { transform: translate(-50%, calc(-50% - 10px)) rotate(1.5deg); }
    }
    @keyframes shake {
      0% { transform: translate(-50%, -50%) rotate(0) scale(1); }
      20% { transform: translate(-50%, -50%) rotate(-8deg) scale(1.04); }
      40% { transform: translate(-50%, -50%) rotate(8deg) scale(1.08); }
      60% { transform: translate(-50%, -50%) rotate(-6deg) scale(1.12); }
      80% { transform: translate(-50%, -50%) rotate(5deg) scale(1.16); }
      100% { transform: translate(-50%, -50%) rotate(0) scale(1.2); }
    }
    @keyframes burst {
      to { transform: translate(-50%, -190%) scale(1.4); opacity: 0; }
    }
    @keyframes ring {
      from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      to { transform: translate(-50%, -50%) scale(16); opacity: 0; }
    }
    @keyframes flash {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }
    @keyframes deal {
      from { transform: translate(-50%, -50%) scale(0.18); opacity: 0; }
      to { transform: translate(calc(-50% + var(--x) * var(--orbit)), calc(-50% + var(--y) * var(--orbit))) rotate(var(--tilt)) scale(1); opacity: 1; }
    }
    @keyframes shine {
      to { transform: translateX(120%); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 60rem) {
      :root { --gutter: 24px; }
      h1 { font-size: var(--text-2xl); }
      .well { min-height: 640px; }
    }
    @media (max-width: 40rem) {
      :root { --gutter: 16px; }
      .choices { grid-template-columns: minmax(0, 1fr); }
      .cats { grid-template-columns: minmax(0, 1fr); }
      .cats .cat-row:nth-child(-n+2) { border-top: var(--rule-hair) solid var(--color-rule); }
      .cats .cat-row:first-child { border-top: 0; }
      .well { min-height: 480px; }
      .fan { --orbit: 112px; }
      .card { width: 88px; height: 138px; }
      .back b { font-size: 40px; }
      .face { padding: var(--space-xs) var(--space-xs) var(--space-sm); gap: var(--space-3xs); }
      .kicker, .link { font-size: 11px; }
      .front h2 { font-size: 12px; }
      .line { font-size: 11px; }
      .reason { font-size: 12px; -webkit-line-clamp: 1; max-height: calc(1.35em * 1); }
      .line:nth-of-type(n+2) { display: none; }
      .pack { width: 180px; height: 264px; }
      .pack-num { margin-top: 68px; font-size: 56px; }
    }
    @media (pointer: coarse) {
      .btn { min-height: 48px; }
      .cat-row { min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pack, .pack.is-shaking, .pack.is-gone, .card, .inner, .burst, .burst.is-on, .flash, .front::after, .state-blink {
        animation: none !important;
        transition: none !important;
      }
      /* 一次性效果元素没有动画就没有退场，直接不渲染 */
      .burst, .flash { display: none !important; }
    }
  </style>

</script>
  <script>
    const state = { live: false, deck: null, category: null, busy: false, drawId: "" };
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const title = document.getElementById("title");
    const lead = document.getElementById("lead");
    const stage = document.getElementById("stage");
    const foot = document.getElementById("foot");
    const mode = document.getElementById("mode");

    function wait(ms) {
      if (reduced || ms <= 0) return Promise.resolve();
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function setFoot(nodes) {
      foot.replaceChildren(...nodes);
    }

    /* 一次性效果元素，用时才创建，动画自己从可见走到消失；减弱动效时整段跳过 */
    function fireBurst(well) {
      if (reduced) return;
      const burst = el("div", "burst is-on");
      burst.setAttribute("aria-hidden", "true");
      well.append(burst);
      window.setTimeout(() => burst.remove(), 700);
    }

    function fireFlash() {
      if (reduced) return;
      const node = el("div", "flash is-on");
      node.setAttribute("aria-hidden", "true");
      document.body.append(node);
      window.setTimeout(() => node.remove(), 500);
    }

    function quietButton(text, run) {
      const button = el("button", "btn btn--quiet", text);
      button.type = "button";
      button.addEventListener("click", run);
      return button;
    }

    function showState(text, back, backLabel) {
      const box = el("div", "state");
      box.append(el("p", null, text));
      stage.replaceChildren(box);
      setFoot(back ? [quietButton(backLabel || "返回", back)] : []);
    }

    function loadData() {
      const node = document.getElementById("chouka-data");
      try {
        const data = JSON.parse(node.textContent);
        if (data && Array.isArray(data.cards) && data.cards.length) return data;
      } catch (err) { /* 用下面的空包提示 */ }
      return { source: "demo", deck: "lunch", category: null, cards: [] };
    }

    function showDecks() {
      state.deck = null;
      state.category = null;
      state.drawId = "";
      title.textContent = "先选一副牌";
      lead.textContent = "午饭选类型，视频选区。选完开一包，一共 5 张。";
      const row = el("div", "choices");
      [
        ["lunch", "午饭", "先选类型，再从里面抽"],
        ["bili_featured", "精选视频", "先选区，再从里面抽"]
      ].forEach((item) => {
        const button = el("button", "choice");
        button.type = "button";
        button.append(el("strong", null, item[1]), el("span", null, item[2]));
        button.addEventListener("click", () => showCategories(item[0]));
        row.append(button);
      });
      stage.replaceChildren(row);
      setFoot([]);
    }

    async function showCategories(deck) {
      state.deck = deck;
      state.category = null;
      const lunch = deck === "lunch";
      title.textContent = lunch ? "想吃哪种？" : "想看哪个区？";
      lead.textContent = lunch
        ? "只从你点的这一类里抽。不够 5 张的类型点不了，也不会拿别的类型来凑。"
        : "只从你点的这个区里抽。区是按标题和精选理由里的关键词归的，一条视频可以同时在多个区。";
      showState("正在看卡池…");
      let data;
      try {
        const res = await fetch("/api/categories?deck=" + encodeURIComponent(deck));
        data = await res.json();
        if (!res.ok) throw new Error(data.error || "读不到分类");
      } catch (err) {
        showState(err.message || "读不到分类", showDecks, "换一副牌");
        return;
      }
      if (state.deck !== deck) return;
      if (!data.categories.length) {
        const empty = lunch ? "卡池里还没有标签。去改 data/lunch.json。" : "还没有分区。去改 data/bili_zones.json 里的关键词。";
        showState(empty, showDecks, "换一副牌");
      } else {
        const list = el("div", "cats");
        data.categories.forEach((item) => {
          const button = el("button", "cat-row");
          button.type = "button";
          button.disabled = !item.ready;
          button.append(
            el("span", "cat-name", item.name),
            el("span", "cat-count num", item.count + " 张"),
            el("span", "cat-state", item.ready ? "可以开包" : "还差 " + item.short + " 张")
          );
          button.addEventListener("click", () => showPack(item));
          list.append(button);
        });
        stage.replaceChildren(list);
        setFoot([quietButton("换一副牌", showDecks)]);
      }
    }

    function showPack(category) {
      state.category = category;
      const lunch = state.deck !== "bili_featured";
      title.textContent = (lunch ? "午饭" : "精选视频") + "：" + category.name;
      lead.textContent = "点击卡包。五张牌背面朝上，落到五角星的五个尖上，点一下才翻开。";
      const well = el("div", "well crt");
      const pack = el("button", "pack" + (lunch ? " deck-lunch" : " pack is-video deck-video"));
      pack.type = "button";
      pack.append(
        el("span", "pack-ribbon", "PACK"),
        el("b", "pack-num num", "5"),
        el("span", "pack-unit", "张牌"),
        el("span", "pack-name", category.name)
      );
      well.append(pack);
      stage.replaceChildren(well);
      setFoot([
        el("p", "hint", "点击卡包"),
        quietButton(lunch ? "换一个类型" : "换一个区", () => {
          if (state.live) showCategories(state.deck);
          else showOffline();
        })
      ]);
      pack.addEventListener("click", () => openPack(well, pack));
    }

    async function openPack(well, pack) {
      if (state.busy) return;
      state.busy = true;
      pack.disabled = true;
      pack.classList.add("is-shaking");
      let data;
      try {
        const pending = state.live ? postDraw(state.deck, state.category.id) : Promise.resolve(loadData());
        data = (await Promise.all([pending, wait(520)]))[0];
      } catch (err) {
        state.busy = false;
        pack.classList.remove("is-shaking");
        pack.disabled = false;
        showState(err.message || "开包失败", () => showPack(state.category), "回到卡包");
        return;
      }
      if (!data.cards || !data.cards.length) {
        state.busy = false;
        showState("这一包是空的。", () => showPack(state.category), "回到卡包");
        return;
      }
      pack.classList.remove("is-shaking");
      pack.classList.add("is-gone");
      fireBurst(well);
      fireFlash();
      await wait(220);
      well.append(renderFan(data));
      await wait(reduced ? 0 : 760);
      state.busy = false;
      state.drawId = data.draw_id || "";
      if (state.drawId) lead.textContent = "这一包是 " + state.drawId + "。点一下翻开。";
      const again = el("button", "btn", "再开一包");
      again.type = "button";
      again.addEventListener("click", () => showPack(state.category));
      const swap = quietButton(state.deck === "bili_featured" ? "换一个区" : "换一个类型", () => state.live ? showCategories(state.deck) : showOffline());
      setFoot([again, swap]);
    }

    async function postDraw(deck, category) {
      const res = await fetch("/api/draw", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deck: deck, category: category })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "开包失败");
      return data;
    }

    function renderFan(data) {
      const fan = el("div", "fan " + (data.deck === "bili_featured" ? "deck-video" : "deck-lunch"));
      const tilts = ["0deg", "16deg", "8deg", "-8deg", "-16deg"];
      data.cards.forEach((card, index) => {
        const point = starPoint(index);
        const button = el("div", "card rarity-" + (card.rarity || "common"));
        button.tabIndex = 0;
        button.setAttribute("role", "button");
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", (card.title || "一张牌") + "，未翻开");
        button.style.setProperty("--i", String(index));
        button.style.setProperty("--x", point.x);
        button.style.setProperty("--y", point.y);
        button.style.setProperty("--tilt", tilts[index] || "0deg");
        button.title = card.reason || "";
        const flip = () => {
          if (state.busy) return;
          const open = button.classList.toggle("is-open");
          button.setAttribute("aria-pressed", open ? "true" : "false");
          button.setAttribute("aria-label", (card.title || "一张牌") + (open ? "，已翻开" : "，未翻开"));
        };
        button.addEventListener("click", flip);
        button.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            flip();
          }
        });
        const inner = el("span", "inner");
        const back = el("span", "side back");
        back.append(el("span", "k", card.kicker || ""), el("b", null, "?"));
        const front = el("span", "side front");
        const face = el("span", "face");
        face.append(el("span", "kicker", card.kicker || ""), el("h2", null, card.title || ""));
        (card.lines || []).forEach((line) => face.append(el("p", "line", line)));
        const tail = reasonTail(card.reason);
        if (tail) face.append(el("p", "reason", tail));
        if (card.url) face.append(videoLink(card.url));
        front.append(face);
        inner.append(back, front);
        button.append(inner);
        fan.append(button);
      });
      return fan;
    }

    function videoLink(url) {
      const link = document.createElement("a");
      link.className = "link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      const bvid = String(url).match(/BV[0-9A-Za-z]+/);
      link.textContent = bvid ? bvid[0] : "打开视频";
      link.title = url;
      link.addEventListener("click", (event) => event.stopPropagation());
      return link;
    }

    /* 卡面上只留理由的尾巴；开头两段和标题、区名重复，完整理由在 title 里。
     * 标题里可能还有嵌套的「」，按括号计数找收口，不能靠 [^」]* */
    function reasonTail(reason) {
      let text = String(reason || "").trim();
      const cutClause = (prefix) => {
        if (!text.startsWith(prefix)) return;
        let depth = 1; /* 前缀里的「已经打开了第一层 */
        for (let i = prefix.length; i < text.length; i++) {
          const ch = text[i];
          if (ch === "「") depth++;
          else if (ch === "」") {
            depth--;
            if (depth === 0) {
              let end = i + 1;
              /* 「你选了」这类句子在引号后面还有说明，吃到本句句号为止 */
              while (end < text.length && text[end] !== "。") end++;
              if (text[end] === "。") end++;
              text = text.slice(end).trim();
              return;
            }
          }
        }
        text = ""; /* 没等到收口就整段不要 */
      };
      cutClause("抽到「");
      cutClause("你选了「");
      return text;
    }

    function starPoint(index) {
      const angle = -Math.PI / 2 + index * (2 * Math.PI / 5);
      return {
        x: Math.cos(angle).toFixed(4),
        y: Math.sin(angle).toFixed(4),
      };
    }

    function showOffline() {
      title.textContent = "看上一包怎么开";
      lead.textContent = "这个文件自己问不了卡池。在仓库里运行 python -m chouka preview，用它打印的地址打开。";
      const saved = loadData();
      const button = el("button", "btn", saved.cards.length ? "先看上一包怎么开" : "还没有上一包");
      button.type = "button";
      button.disabled = !saved.cards.length;
      button.addEventListener("click", () => {
        state.deck = saved.deck || "lunch";
        showPack({ id: "saved", name: saved.category || "上一包" });
      });
      const box = el("div", "state");
      box.append(el("p", null, "离线重播：只放最近一次抽取的记录，不开新的包。"));
      stage.replaceChildren(box);
      setFoot([button]);
    }

    async function boot() {
      try {
        const res = await fetch("/api/categories?deck=lunch");
        await res.json();
        state.live = true;
      } catch (err) {
        state.live = false;
      }
      mode.textContent = state.live ? "卡池已连接" : "离线重播";
      if (state.live) showDecks();
      else showOffline();
    }

    boot();
  </script>
